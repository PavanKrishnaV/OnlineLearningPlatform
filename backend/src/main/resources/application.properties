spring.application.name=online-learning-platform
server.port=8081

# H2 Configuration
spring.datasource.url=jdbc:h2:mem:online_learning;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret (keep secret in production)
spring.jwt.secret=MySuperSecretKeyForJwtAuthenticationThatIsLongEnoughToSatisfyTheHS512AlgorithmRequirement1234567890
spring.jwt.expirationMs=86400000

# File upload path
file.upload-dir=uploads

# Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
